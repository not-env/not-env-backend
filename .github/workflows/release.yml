name: Build and Publish Docker Images

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push minimal image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/not-env/not-env:${{ steps.version.outputs.version }}
            ghcr.io/not-env/not-env:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Build and push SQLite image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sqlite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/not-env/not-env-standalone:${{ steps.version.outputs.version }}
            ghcr.io/not-env/not-env-standalone:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

