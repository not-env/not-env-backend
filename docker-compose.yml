version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: not-env-postgres
    environment:
      POSTGRES_USER: notenv
      POSTGRES_PASSWORD: notenv_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notenv"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: not-env-backend
    environment:
      pg_url: postgres:5432
      pg_username: notenv
      pg_password: notenv_password
      pg_db_name: notenv
      NOT_ENV_MASTER_KEY: ${NOT_ENV_MASTER_KEY}
    ports:
      - "1212:1212"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

